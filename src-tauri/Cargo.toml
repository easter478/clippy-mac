[package]
name = "clippy"
version = "1.1.0"
description = "Clippy: a desktop paperclip buddy for macOS with a built-in local Qwen chat and optional homelab integrations"
edition = "2021"
publish = false

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["metal"] }
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false }
dirs = "6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
