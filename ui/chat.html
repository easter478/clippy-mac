<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with Clippy</title>
<link rel="stylesheet" href="common.css">
<style>
/* Chat: native sidebar vibrancy behind the window; messages are translucent tints, never solid boxes. */
body { display: flex; flex-direction: column; height: 100vh; }
.top { height: 52px; flex: none; -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 84px; }
.top .logo svg { width: 11px; height: 18px; display: block; color: var(--fg); }
.top b { font-size: 13px; font-weight: 650; flex: 1; }
.top select, .top button { -webkit-app-region: no-drag; }
.chip { background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 4px 6px; font: inherit; font-size: 12px; max-width: 150px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); -webkit-app-region: no-drag; }
.seg button { border: 0; background: transparent; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.icon-btn { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-hover); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#log { flex: 1; overflow-y: auto; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 12px; -webkit-user-select: text; user-select: text; }
.msg { display: flex; gap: 9px; max-width: 100%; }
.msg.me { justify-content: flex-end; }
.msg .av { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--surface-strong); border: 1px solid var(--line); display: grid; place-items: center; margin-top: 2px; }
.msg .av svg { width: 9px; height: 15px; color: var(--fg); }
.body { max-width: 84%; min-width: 0; }
.bub { padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--rim); }
.me .bub { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.bot .bub { background: var(--surface); border-bottom-left-radius: 5px; }
.bub p { margin: 0 0 7px; } .bub p:last-child { margin-bottom: 0; }
.bub ul, .bub ol { margin: 4px 0 7px; padding-left: 20px; }
.bub code { font-family: var(--mono); font-size: 12px; background: var(--surface-strong); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.bub pre { background: var(--surface-strong); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; }
.bub pre code { background: none; border: 0; padding: 0; }
.bub a { color: var(--accent); cursor: pointer; }
.bub.err { color: var(--bad); }
.meta { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin: 4px 4px 0; min-height: 16px; }
.meta button { border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 11px; }
.meta button:hover { color: var(--fg); text-decoration: underline; }
.cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }
.empty { margin: auto; text-align: center; color: var(--muted); padding: 20px; max-width: 320px; }
.empty .big svg { width: 44px; height: 70px; color: var(--fg); opacity: .8; }
.empty h2 { color: var(--fg); font-size: 16px; margin: 10px 0 4px; }
.empty p { font-size: 12.5px; line-height: 1.5; margin: 0 0 12px; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sugs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
.sugs button:hover { background: var(--surface-hover); }
.btn { border: 1px solid var(--line); background: var(--surface-strong); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.bar { height: 5px; border-radius: 99px; background: var(--surface-strong); overflow: hidden; margin: 10px 0 4px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#status { font-size: 11.5px; color: var(--muted); padding: 0 16px 4px; min-height: 16px; }
.compose { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px 12px; }
#q { flex: 1; resize: none; max-height: 140px; min-height: 38px; background: var(--surface-strong); border: 1px solid var(--line); color: var(--fg);
  border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 13.5px; line-height: 1.4; outline: none; }
#q:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
#send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
#send svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#send.stop { background: var(--bad); }
#send:disabled { opacity: .45; }
[hidden] { display: none !important; }
/* the Deck's tiles inside the chat: a frosted sheet under the header */
body { position: relative; }
#deckbtn[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }
.deckp { position: absolute; top: 52px; left: 10px; right: 10px; z-index: 4; padding: 10px; border-radius: 14px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface-strong) 70%, transparent); box-shadow: inset 0 1px 0 var(--rim), 0 12px 32px rgba(0,0,0,.28);
  backdrop-filter: blur(28px) saturate(1.5); -webkit-backdrop-filter: blur(28px) saturate(1.5); max-height: calc(100vh - 140px); overflow-y: auto; }
.dhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 8px; }
.dhead b { font-size: 12px; font-weight: 650; } .dhead small { font-size: 11px; color: var(--muted); }
.dtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.dtile { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px; font-size: 11px; font-weight: 550; line-height: 1.2; color: var(--fg); min-height: 62px; min-width: 0;
  box-shadow: inset 0 1px 0 var(--rim); transition: background .14s, transform .08s; }
.dtile:hover { background: var(--surface-hover); } .dtile:active { transform: scale(.96); }
.dtile span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.dtile svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="top">
  <span class="logo" id="logo"></span><b>Clippy</b>
  <select class="chip" id="model" aria-label="Model"></select>
  <button class="icon-btn" id="new" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="icon-btn" id="gear" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="icon-btn" id="deckbtn" title="Deck" aria-label="Deck" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg></button>
</div>
<div class="deckp" id="deckp" hidden><div class="dhead"><b>Clippy Deck</b><small>Clippy answers next to the chat</small></div><div class="dtiles" id="dtiles"></div></div>
<div id="log"></div>
<div id="status"></div>
<form class="compose" id="form">
  <textarea id="q" rows="1" placeholder="Ask Clippy anything…" aria-label="Message"></textarea>
  <button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</form>
<script src="clip.js"></script>
<script src="tiles.js"></script>
<script src="chat.js"></script>
</body>
</html>
